<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>溶解度 ステップ可視化教材</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#e5e7eb;--water:#93c5fd;--solute:#86efac;--crystal:#fca5a5;--hydrate:#fcd34d;--accent:#2563eb;--active:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:22px 14px;text-align:center;background:linear-gradient(135deg,#dbeafe,#dcfce7)}h1{margin:0;font-size:clamp(22px,4vw,34px)}p{color:var(--muted)}
main{max-width:1200px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 25px #0f172a0b}
.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}@media(max-width:1050px){.three{grid-template-columns:1fr}}
label{display:block;font-weight:800;margin:12px 0 6px}select,input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:white}
.row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center}input[type=range]{padding:0;accent-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;font-weight:900;cursor:pointer}.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tempBtns,.miniSelect{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.tempBtns button,.miniSelect button{padding:9px 0;border:1px solid var(--line);background:white;border-radius:9px;font-weight:900;cursor:pointer}.tempBtns button.on,.miniSelect button.on{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.problem{font-size:17px;line-height:1.9;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px}
.stepBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stepBtns button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 14px;font-weight:900;cursor:pointer}.stepBtns button.primary{background:var(--accent);color:white}.stepBtns button:disabled{opacity:.45}
.stepList{display:grid;gap:8px;margin-top:12px}.stepItem{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.stepItem.active{background:var(--active);border-color:#facc15}.stepItem.done{background:#ecfdf5;border-color:#86efac}
.barLabel{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin:12px 0 5px}.bar{height:44px;border:1px solid var(--line);border-radius:999px;overflow:hidden;display:flex;background:#f8fafc}
.seg{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;white-space:nowrap;min-width:0}.water{background:var(--water)}.solute{background:var(--solute)}.crystal{background:var(--crystal)}.hydrate{background:var(--hydrate)}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.pill{border:1px solid var(--line);border-radius:14px;background:#f8fafc;padding:12px}.pill span{font-size:13px;color:var(--muted)}.pill b{display:block;font-size:20px;margin-top:2px}
.formula{background:#0f172a;color:#f8fafc;border-radius:14px;padding:14px;line-height:1.75;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;overflow:auto;min-height:180px}
.beakers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.beaker{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.cup{height:190px;border:5px solid #94a3b8;border-top:0;border-radius:0 0 26px 26px;position:relative;overflow:hidden;background:#f8fafc;margin-top:12px}
.liquid{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#bfdbfe,#93c5fd);display:flex;align-items:center;justify-content:center;font-weight:900;transition:height .45s}
.solid{position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(45deg,#fca5a5,#fca5a5 8px,#fecaca 8px,#fecaca 16px);display:flex;align-items:center;justify-content:center;font-weight:900;transition:height .45s}
.ratioCard{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:14px;line-height:1.8}.miniBar{height:28px;border-radius:999px;overflow:hidden;display:flex;border:1px solid #fed7aa;margin-top:8px}.miniCu{background:var(--solute);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.miniWater{background:var(--hydrate);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.highlight{background:var(--active);padding:2px 6px;border-radius:8px;font-weight:900}
</style>
</head>
<body>
<header><h1>溶解度 ステップ可視化教材</h1><p>問題 → 状況整理 → ビーカー → 式 → 答えを「次へ」で確認</p></header>
<main>
<section class="card"><div class="tabs">
<button class="tab on" data-mode="max">水○gに何gまで溶けるか</button>
<button class="tab" data-mode="cool">飽和溶液を冷やす</button>
<button class="tab" data-mode="hydrateDissolve">水和物は何g溶けるか</button>
<button class="tab" data-mode="hydrateCool">水和物として析出</button>
</div></section>

<div class="grid">
<section class="card">
<h2>条件</h2>
<div id="normalSubBox"><label>物質</label><select id="sub"></select></div>
<div id="hydrateSubBox" class="hidden"><label>水和物</label><select><option>硫酸銅(II)五水和物 CuSO₄・5H₂O</option></select></div>
<div id="oneTemp"><label>温度</label><div id="tempBtns" class="tempBtns"></div></div>
<div id="twoTemp" class="hidden"><label>高温</label><div id="hotBtns" class="tempBtns"></div><label>低温</label><div id="coldBtns" class="tempBtns"></div></div>
<div id="waterBox"><label>水の質量 g</label><div class="row"><input id="water" type="range" min="1" max="300" step="1" value="100"><input id="waterNum" type="number" min="0" step="0.1" value="100"></div></div>
<div id="coolInputModeBox" class="hidden"><label>冷却前の量を何で指定するか</label><div class="miniSelect">
<button id="bySolution" class="on">飽和溶液g</button><button id="byWater">溶媒g</button><button id="bySolute">溶質g</button><button id="byBoth">溶媒＋溶質</button>
</div></div>
<div id="solutionBox" class="hidden"><label>飽和溶液の質量 g</label><div class="row"><input id="solutionMass" type="range" min="1" max="300" step="1" value="100"><input id="solutionMassNum" type="number" min="0" step="0.1" value="100"></div></div>
<div id="coolWaterBox" class="hidden"><label>冷却前の溶媒（水）g</label><div class="row"><input id="coolWater" type="range" min="1" max="300" step="1" value="80"><input id="coolWaterNum" type="number" min="0" step="0.1" value="80"></div></div>
<div id="coolSoluteBox" class="hidden"><label>冷却前に溶けている溶質 g</label><div class="row"><input id="coolSolute" type="range" min="0" max="300" step="0.1" value="20"><input id="coolSoluteNum" type="number" min="0" step="0.1" value="20"></div></div>
</section>
<section class="card"><h2>問題</h2><div id="problem" class="problem"></div><div id="answer" class="result"></div></section>
</div>

<section class="card">
<h2>ステップ解説</h2>
<div class="stepBtns"><button id="prev">◀ 前へ</button><button id="next" class="primary">次へ ▶</button><button id="reset">最初から</button></div>
<div id="steps" class="stepList"></div>
</section>

<section class="card" id="ratioSection"><h2>水和物の割合</h2><div id="ratioInfo" class="ratioCard"></div></section>

<div class="three">
<section class="card"><h2>ビーカー</h2><div id="beakers" class="beakers"></div></section>
<section class="card"><h2>質量比バー</h2><div id="bars"></div></section>
<section class="card"><h2>今の式</h2><div id="formula" class="formula"></div></section>
</div>
</main>
<script>
const data = {"KNO3": {"name": "硝酸カリウム KNO₃", "plain": "硝酸カリウム", "formula": "KNO₃", "values": {"0": 13.3, "10": 22.0, "20": 31.6, "30": 45.6, "40": 63.9, "60": 109, "80": 169, "100": 245}}, "CuSO4": {"name": "硫酸銅(II) CuSO₄", "plain": "硫酸銅(II)", "formula": "CuSO₄", "values": {"0": 14.0, "10": 17.0, "12": 15, "20": 20.2, "30": 24.1, "40": 28.7, "48": 25, "60": 39.9, "80": 56.0, "100": 94.9}}, "NaCl": {"name": "塩化ナトリウム NaCl", "plain": "塩化ナトリウム", "formula": "NaCl", "values": {"0": 35.7, "10": 35.7, "20": 35.8, "30": 36.1, "40": 36.3, "60": 37.1, "80": 38.0, "100": 39.3}}, "KCl": {"name": "塩化カリウム KCl", "plain": "塩化カリウム", "formula": "KCl", "values": {"0": 28.1, "10": 31.2, "20": 34.2, "30": 37.2, "40": 40.1, "60": 45.8, "80": 51.3, "100": 56.3}}, "AgNO3": {"name": "硝酸銀 AgNO₃", "plain": "硝酸銀", "formula": "AgNO₃", "values": {"0": 121, "10": 167, "20": 216, "30": 265, "40": 312, "60": 441, "80": 585, "100": 733}}, "NaNO3": {"name": "硝酸ナトリウム NaNO₃", "plain": "硝酸ナトリウム", "formula": "NaNO₃", "values": {"0": 73.0, "10": 80.5, "20": 88.0, "30": 96.1, "40": 105, "60": 124, "80": 148, "100": 175}}, "Na2SO4": {"name": "硫酸ナトリウム Na₂SO₄", "plain": "硫酸ナトリウム", "formula": "Na₂SO₄", "values": {"0": 4.5, "10": 9.0, "20": 19.0, "30": 41.2, "40": 49.7, "60": 45.1, "80": 43.3, "100": 42.2}}, "CaSO4": {"name": "硫酸カルシウム CaSO₄", "plain": "硫酸カルシウム", "formula": "CaSO₄", "values": {"0": 0.18, "10": 0.19, "20": 0.21, "30": 0.21, "40": 0.21, "60": 0.15, "80": 0.1, "100": 0.07}}, "ZnSO4": {"name": "硫酸亜鉛 ZnSO₄", "plain": "硫酸亜鉛", "formula": "ZnSO₄", "values": {"0": 41.6, "10": 47.3, "20": 53.8, "30": 69.4, "40": 75.4, "60": 72.1, "80": 65.0, "100": 60.5}}};
let mode="max", temp=40, hot=60, cold=10, coolInputMode="solution", step=0, currentSteps=[];
const $=id=>document.getElementById(id), n=id=>Number($(id).value), f=x=>Math.round(Number(x)*10)/10, fi=x=>Math.round(Number(x));
const tempsFor=k=>Object.keys(data[k].values).map(Number).sort((a,b)=>a-b), s=(k,t)=>Number(data[k].values[t]);
const pct=(x,t)=>t>0?Math.max(0,Number(x)/t*100):0, pill=(a,b)=>`<div class="pill"><span>${a}</span><b>${b}</b></div>`;
const currentKey=()=>mode.startsWith("hydrate")?"CuSO4":$("sub").value;
function chooseDefaultTemp(key, pref, idx=0){const ts=tempsFor(key);return ts.includes(pref)?pref:(ts[idx]??ts[0]);}
function bar(title,items){const total=items.reduce((a,i)=>a+Math.max(0,Number(i.mass)),0);return `<div><div class="barLabel"><span>${title}</span><span>${f(total)} g</span></div><div class="bar">`+items.map(i=>`<div class="seg ${i.cls}" style="width:${pct(i.mass,total)}%">${pct(i.mass,total)>10?i.label:""}</div>`).join("")+`</div></div>`}
function beaker(title,water,solute,crystal=0){water=Math.max(0,Number(water));solute=Math.max(0,Number(solute));crystal=Math.max(0,Number(crystal));const total=Math.max(1,water+solute+crystal),liqH=Math.max(8,Math.min(160,(water+solute)/total*170)),solH=crystal>0?Math.max(8,Math.min(80,crystal/total*170)):0;return `<div class="beaker"><b>${title}</b><div class="cup"><div class="liquid" style="height:${liqH}px">溶液 ${f(water+solute)}g</div><div class="solid" style="height:${solH}px">${crystal>0?"結晶 "+f(crystal)+"g":""}</div></div><p class="muted">水 ${f(water)}g / 溶質 ${f(solute)}g${crystal>0?" / 結晶 "+f(crystal)+"g":""}</p></div>`}
function getInitial(hotSol){let water0,solute0,M,note;if(coolInputMode==="solution"){M=n("solutionMass");water0=M*100/(100+hotSol);solute0=M*hotSol/(100+hotSol);note=`飽和溶液${f(M)}g`}else if(coolInputMode==="water"){water0=n("coolWater");solute0=water0*hotSol/100;M=water0+solute0;note=`溶媒${f(water0)}g`}else if(coolInputMode==="solute"){solute0=n("coolSolute");water0=solute0*100/hotSol;M=water0+solute0;note=`溶質${f(solute0)}g`}else{water0=n("coolWater");solute0=n("coolSolute");M=water0+solute0;note=`溶媒${f(water0)}g＋溶質${f(solute0)}g`}return{water0,solute0,M,note}}
function renderRatio(){const show=mode.startsWith("hydrate");$("ratioSection").classList.toggle("hidden",!show); if(!show)return; $("ratioInfo").innerHTML=`<b>CuSO₄・5H₂O の中身</b><br>CuSO₄部分：<span class="highlight">160/250=0.64</span>　結晶水：<span class="highlight">90/250=0.36</span><div class="miniBar"><div class="miniCu" style="width:64%">CuSO₄ 160</div><div class="miniWater" style="width:36%">5H₂O 90</div></div>水和物を x g とすると、CuSO₄部分は0.64x、水和水は0.36x。`;}
function renderButtons(box,kind,selected,key){const ts=tempsFor(key),el=$(box);el.innerHTML="";if(!ts.includes(selected)){if(kind==="temp")temp=chooseDefaultTemp(key,40);if(kind==="hot")hot=chooseDefaultTemp(key,60,ts.length-1);if(kind==="cold")cold=chooseDefaultTemp(key,10);selected=kind==="temp"?temp:kind==="hot"?hot:cold}ts.forEach(t=>{const b=document.createElement("button");b.textContent=t+"℃";b.className=t===selected?"on":"";b.onclick=()=>{if(kind==="temp")temp=t;if(kind==="hot")hot=t;if(kind==="cold")cold=t;step=0;render()};el.appendChild(b)})}
function stepList(arr){currentSteps=arr;if(step>=arr.length)step=arr.length-1;return arr}
function showSteps(){ $("steps").innerHTML=currentSteps.map((x,i)=>`<div class="stepItem ${i<step?"done":i===step?"active":""}"><b>${i+1}. ${x.title}</b><br>${i<=step?x.text:"まだ表示しません"}</div>`).join(""); $("formula").textContent=currentSteps[step]?.formula||""; $("prev").disabled=step<=0; $("next").disabled=step>=currentSteps.length-1; }
function renderMax(){const key=$("sub").value, sol=s(key,temp), w=n("water"), amount=w*sol/100, solution=w+amount;$("problem").innerHTML=`問　${temp}℃の水${f(w)}gに${data[key].plain}は何gまで溶けるか。また，できる飽和溶液は何gか。ただし，${temp}℃における溶解度は${sol}である。`;$("answer").innerHTML=pill("答え",`${f(amount)}g`)+pill("溶液",`${f(solution)}g`);$("beakers").innerHTML=beaker("飽和溶液",w,amount);$("bars").innerHTML=bar("飽和溶液",[{label:`水 ${f(w)}g`,mass:w,cls:"water"},{label:`溶質 ${f(amount)}g`,mass:amount,cls:"solute"}]);stepList([{title:"溶解度を確認",text:`水100gに${sol}g溶ける。`,formula:`溶解度 = ${sol} g / 水100g`},{title:"水の量に合わせる",text:`水${f(w)}gなので，比例で求める。`,formula:`溶質 = ${f(w)} × ${sol} / 100 = ${f(amount)}g`},{title:"溶液量を求める",text:`水と溶けた溶質を足す。`,formula:`溶液 = ${f(w)} + ${f(amount)} = ${f(solution)}g`}]);showSteps()}
function renderCool(){const key=$("sub").value,sH=s(key,hot),sC=s(key,cold),init=getInitial(sH),water0=init.water0,solute0=init.solute0,M=init.M,soluteCold=water0*sC/100,crystal=Math.max(0,solute0-soluteCold);$("problem").innerHTML=`例題　${data[key].plain}の${hot}℃における飽和水溶液を${cold}℃に冷やす。ただし，溶解度は${hot}℃で${sH}，${cold}℃で${sC}である。このとき，何gの結晶が析出するか。`;$("answer").innerHTML=pill("析出量",`${f(crystal)}g`)+pill("冷却前溶液",`${f(M)}g`);$("beakers").innerHTML=beaker(`${hot}℃`,water0,solute0)+beaker(`${cold}℃`,water0,soluteCold,crystal);$("bars").innerHTML=bar("冷却前",[{label:`水 ${f(water0)}g`,mass:water0,cls:"water"},{label:`溶質 ${f(solute0)}g`,mass:solute0,cls:"solute"}])+bar("冷却後",[{label:`水 ${f(water0)}g`,mass:water0,cls:"water"},{label:`溶質 ${f(soluteCold)}g`,mass:soluteCold,cls:"solute"},{label:`結晶 ${f(crystal)}g`,mass:crystal,cls:"crystal"}]);stepList([{title:"問題の条件",text:`${hot}℃の溶解度は${sH}，${cold}℃の溶解度は${sC}。問題文では内訳をまだ出さない。`,formula:`溶解度：${hot}℃ ${sH} / ${cold}℃ ${sC}`},{title:"冷却前の内訳",text:`${init.note}から，水${f(water0)}g，${data[key].formula}${f(solute0)}g，溶液${f(M)}g。`,formula:`水 : 溶質 : 溶液 = 100 : ${sH} : ${f(100+sH)}`},{title:"低温で残れる量",text:`水の量は変わらないので，${cold}℃で溶ける量を求める。`,formula:`残る溶質 = ${f(water0)} × ${sC} / 100 = ${f(soluteCold)}g`},{title:"析出量",text:`冷却前に溶けていた量から，低温で残れる量を引く。`,formula:`析出量 = ${f(solute0)} - ${f(soluteCold)} = ${f(crystal)}g`}]);showSteps()}
function renderHydrateDissolve(){const sol=s("CuSO4",temp),w=n("water"),x=sol*w/(64-0.36*sol),cuso4=.64*x,hyd=.36*x,totalWater=w+hyd;$("problem").innerHTML=`例題　CuSO₄・5H₂Oは，${temp}℃の水${f(w)}gに何g溶けるか。ただし，CuSO₄の${temp}℃における溶解度は${sol}である。`;$("answer").innerHTML=pill("水和物",`${f(x)}g`)+pill("整数値",`${fi(x)}g`);$("beakers").innerHTML=beaker("水和物を溶かした後",totalWater,cuso4);$("bars").innerHTML=bar("水和物の内訳",[{label:`CuSO₄ ${f(cuso4)}g`,mass:cuso4,cls:"solute"},{label:`水和水 ${f(hyd)}g`,mass:hyd,cls:"hydrate"}])+bar("飽和溶液",[{label:`水 ${f(totalWater)}g`,mass:totalWater,cls:"water"},{label:`CuSO₄ ${f(cuso4)}g`,mass:cuso4,cls:"solute"}]);stepList([{title:"水和物の割合",text:`CuSO₄部分は160/250，水和水は90/250。`,formula:`CuSO₄ = 160/250 x = 0.64x\n水和水 = 90/250 x = 0.36x`},{title:"水は水和水の分だけ増える",text:`最初の水${f(w)}gに水和水0.36xが加わる。`,formula:`水 = ${f(w)} + 0.36x`},{title:"溶解度の比を立てる",text:`CuSO₄ : 水 = ${sol} : 100。`,formula:`0.64x : (${f(w)} + 0.36x) = ${sol} : 100`},{title:"答え",text:`水和物は${f(x)}g溶ける。`,formula:`x = ${f(x)}g`}]);showSteps()}
function renderHydrateCool(){const sH=s("CuSO4",hot),sC=s("CuSO4",cold),init=getInitial(sH),water0=init.water0,cuso40=init.solute0,M=init.M,x=Math.max(0,(cuso40-sC*water0/100)/(.64-.36*sC/100)),cuso4F=cuso40-.64*x,waterF=water0-.36*x;$("problem").innerHTML=`〔問題〕硫酸銅(II)の${hot}℃における飽和水溶液を${cold}℃まで冷却する。ただし，CuSO₄の溶解度は${hot}℃で${sH}，${cold}℃で${sC}であり，析出する結晶はCuSO₄・5H₂Oである。このとき，何gの結晶が析出するか。`;$("answer").innerHTML=pill("析出結晶",`${f(x)}g`)+pill("整数値",`${fi(x)}g`);$("beakers").innerHTML=beaker(`${hot}℃`,water0,cuso40)+beaker(`${cold}℃`,waterF,cuso4F,x);$("bars").innerHTML=bar("冷却前",[{label:`水 ${f(water0)}g`,mass:water0,cls:"water"},{label:`CuSO₄ ${f(cuso40)}g`,mass:cuso40,cls:"solute"}])+bar("析出結晶の内訳",[{label:`CuSO₄ ${f(.64*x)}g`,mass:.64*x,cls:"solute"},{label:`結晶水 ${f(.36*x)}g`,mass:.36*x,cls:"hydrate"}])+bar("冷却後",[{label:`水 ${f(waterF)}g`,mass:waterF,cls:"water"},{label:`CuSO₄ ${f(cuso4F)}g`,mass:cuso4F,cls:"solute"}]);stepList([{title:"問題の条件",text:`溶解度は${hot}℃で${sH}，${cold}℃で${sC}。結晶はCuSO₄・5H₂O。`,formula:`CuSO₄・5H₂O = CuSO₄ 160 + 5H₂O 90 = 250`},{title:"冷却前の内訳",text:`${init.note}から，水${f(water0)}g，CuSO₄${f(cuso40)}g，溶液${f(M)}g。`,formula:`水 : CuSO₄ : 溶液 = 100 : ${sH} : ${f(100+sH)}`},{title:"析出結晶をx gとおく",text:`結晶にはCuSO₄だけでなく，結晶水も含まれる。`,formula:`CuSO₄部分 = 160/250 x = 0.64x\n結晶水 = 90/250 x = 0.36x`},{title:"冷却後の溶液を考える",text:`結晶として出た分だけ，溶液中のCuSO₄と水が減る。`,formula:`CuSO₄ = ${f(cuso40)} - 0.64x\n水 = ${f(water0)} - 0.36x`},{title:"低温の溶解度で式を立てる",text:`冷却後の溶液は${cold}℃の飽和状態。`,formula:`(${f(cuso40)} - 0.64x) : (${f(water0)} - 0.36x) = ${sC} : 100`},{title:"答え",text:`析出するCuSO₄・5H₂Oは${f(x)}g。`,formula:`x = ${f(x)}g`}]);showSteps()}
function updateVisibility(){const hyd=mode.startsWith("hydrate"),cooling=mode==="cool"||mode==="hydrateCool";$("normalSubBox").classList.toggle("hidden",hyd);$("hydrateSubBox").classList.toggle("hidden",!hyd);$("oneTemp").classList.toggle("hidden",cooling);$("twoTemp").classList.toggle("hidden",!cooling);$("waterBox").classList.toggle("hidden",cooling);$("coolInputModeBox").classList.toggle("hidden",!cooling);$("solutionBox").classList.toggle("hidden",!(cooling&&coolInputMode==="solution"));$("coolWaterBox").classList.toggle("hidden",!(cooling&&(coolInputMode==="water"||coolInputMode==="both")));$("coolSoluteBox").classList.toggle("hidden",!(cooling&&(coolInputMode==="solute"||coolInputMode==="both")));["bySolution","byWater","bySolute","byBoth"].forEach(id=>$(id).classList.remove("on"));({solution:"bySolution",water:"byWater",solute:"bySolute",both:"byBoth"}[coolInputMode]&&$(({solution:"bySolution",water:"byWater",solute:"bySolute",both:"byBoth"}[coolInputMode])).classList.add("on"))}
function render(){updateVisibility();renderRatio();const key=currentKey();renderButtons("tempBtns","temp",temp,key);renderButtons("hotBtns","hot",hot,key);renderButtons("coldBtns","cold",cold,key);if(mode==="max")renderMax();if(mode==="cool")renderCool();if(mode==="hydrateDissolve")renderHydrateDissolve();if(mode==="hydrateCool")renderHydrateCool()}
function pair(a,b){$(a).oninput=()=>{$(b).value=$(a).value;step=0;render()};$(b).oninput=()=>{$(a).value=$(b).value;step=0;render()}}
Object.keys(data).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=data[k].name;$("sub").appendChild(o)});$("sub").value="KNO3";
$("sub").onchange=()=>{const key=$("sub").value;temp=chooseDefaultTemp(key,40);hot=chooseDefaultTemp(key,60,tempsFor(key).length-1);cold=chooseDefaultTemp(key,10);step=0;render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.mode;step=0;render()});
pair("water","waterNum");pair("solutionMass","solutionMassNum");pair("coolWater","coolWaterNum");pair("coolSolute","coolSoluteNum");
$("bySolution").onclick=()=>{coolInputMode="solution";step=0;render()};$("byWater").onclick=()=>{coolInputMode="water";step=0;render()};$("bySolute").onclick=()=>{coolInputMode="solute";step=0;render()};$("byBoth").onclick=()=>{coolInputMode="both";step=0;render()};
$("next").onclick=()=>{if(step<currentSteps.length-1){step++;showSteps()}};$("prev").onclick=()=>{if(step>0){step--;showSteps()}};$("reset").onclick=()=>{step=0;showSteps()};
render();
</script>
