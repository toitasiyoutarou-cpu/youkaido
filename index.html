<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>溶解度 問題文形式 可視化</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#e5e7eb;--water:#93c5fd;--solute:#86efac;--crystal:#fca5a5;--hydrate:#fcd34d;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:22px 14px;text-align:center;background:linear-gradient(135deg,#dbeafe,#dcfce7)}h1{margin:0;font-size:clamp(22px,4vw,34px)}p{color:var(--muted)}
main{max-width:1160px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 25px #0f172a0b}
.grid{display:grid;grid-template-columns:390px 1fr;gap:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:800;margin:12px 0 6px}select,input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:white}
.row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center}input[type=range]{padding:0;accent-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;font-weight:900;cursor:pointer}.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.miniSelect{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.miniSelect button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px;font-weight:900;cursor:pointer}.miniSelect button.on{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.tempBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.tempBtns button{padding:9px 0;border:1px solid var(--line);background:white;border-radius:9px;font-weight:900;cursor:pointer}.tempBtns button.on{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}
.problem{font-size:18px;line-height:1.9;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px}
.barLabel{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin:12px 0 5px}.bar{height:46px;border:1px solid var(--line);border-radius:999px;overflow:hidden;display:flex;background:#f8fafc}
.seg{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;white-space:nowrap;min-width:0}.water{background:var(--water)}.solute{background:var(--solute)}.crystal{background:var(--crystal)}.hydrate{background:var(--hydrate)}
.result{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}@media(max-width:760px){.result{grid-template-columns:1fr 1fr}}
.pill{border:1px solid var(--line);border-radius:14px;background:#f8fafc;padding:12px}.pill span{font-size:13px;color:var(--muted)}.pill b{display:block;font-size:20px;margin-top:2px}
.formula{background:#0f172a;color:#f8fafc;border-radius:14px;padding:14px;line-height:1.75;white-space:pre-wrap;font-family:Consolas,Menlo,monospace;overflow:auto}
.beakers{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.beakers{grid-template-columns:1fr}}
.beaker{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.cup{height:190px;border:5px solid #94a3b8;border-top:0;border-radius:0 0 26px 26px;position:relative;overflow:hidden;background:#f8fafc;margin-top:12px}
.liquid{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#bfdbfe,#93c5fd);display:flex;align-items:center;justify-content:center;font-weight:900}
.solid{position:absolute;bottom:0;left:0;right:0;background:repeating-linear-gradient(45deg,#fca5a5,#fca5a5 8px,#fecaca 8px,#fecaca 16px);display:flex;align-items:center;justify-content:center;font-weight:900}
.ratioCard{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:14px;line-height:1.8}
.ratioGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(max-width:700px){.ratioGrid{grid-template-columns:1fr}}
.ratioBox{background:white;border:1px solid #fed7aa;border-radius:12px;padding:10px}.ratioBig{font-size:22px;font-weight:900;color:#c2410c}
.miniBar{height:28px;border-radius:999px;overflow:hidden;display:flex;border:1px solid #fed7aa;margin-top:8px}.miniCu{background:var(--solute);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}.miniWater{background:var(--hydrate);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1>溶解度 問題文形式 可視化</h1><p>問題文・ビーカー・質量比バー・数式を同時に表示</p></header>
<main>
<section class="card">
<div class="tabs">
<button class="tab on" data-mode="max">水○gに何gまで溶けるか</button>
<button class="tab" data-mode="cool">飽和溶液を冷やす</button>
<button class="tab" data-mode="hydrateDissolve">水和物は何g溶けるか</button>
<button class="tab" data-mode="hydrateCool">水和物として析出</button>
</div>
</section>

<div class="grid">
<section class="card">
<h2>条件</h2>
<div id="normalSubBox"><label>物質</label><select id="sub"></select></div>
<div id="hydrateSubBox" class="hidden"><label>水和物</label><select><option>硫酸銅(II)五水和物 CuSO₄・5H₂O（式量250 / CuSO₄部分160）</option></select></div>

<div id="oneTemp"><label>温度</label><div id="tempBtns" class="tempBtns"></div></div>
<div id="twoTemp" class="hidden"><label>高温</label><div id="hotBtns" class="tempBtns"></div><label>低温</label><div id="coldBtns" class="tempBtns"></div></div>

<div id="waterBox"><label>水の質量 g</label><div class="row"><input id="water" type="range" min="1" max="300" step="1" value="100"><input id="waterNum" type="number" min="0" step="0.1" value="100"></div></div>

<div id="coolInputModeBox" class="hidden">
<label>冷却前の量を何で指定するか</label>
<div class="miniSelect">
<button id="bySolution" class="on">飽和溶液 g</button><button id="byWater">溶媒 g</button><button id="bySolute">溶質 g</button><button id="byBoth">溶媒＋溶質</button>
</div>
</div>
<div id="solutionBox" class="hidden"><label>飽和溶液の質量 g</label><div class="row"><input id="solutionMass" type="range" min="1" max="300" step="1" value="100"><input id="solutionMassNum" type="number" min="0" step="0.1" value="100"></div></div>
<div id="coolWaterBox" class="hidden"><label>冷却前の溶媒（水）g</label><div class="row"><input id="coolWater" type="range" min="1" max="300" step="1" value="80"><input id="coolWaterNum" type="number" min="0" step="0.1" value="80"></div></div>
<div id="coolSoluteBox" class="hidden"><label>冷却前に溶けている溶質 g</label><div class="row"><input id="coolSolute" type="range" min="0" max="300" step="0.1" value="20"><input id="coolSoluteNum" type="number" min="0" step="0.1" value="20"></div></div>
</section>

<section class="card"><h2>問題文</h2><div id="problem" class="problem"></div><div id="answer" class="result"></div></section>
</div>

<section class="card" id="ratioSection"><h2>水和物の割合</h2><div id="ratioInfo" class="ratioCard"></div></section>
<section class="card"><h2>ビーカー表示</h2><div id="beakers" class="beakers"></div></section>
<section class="card"><h2>質量比バー</h2><div id="bars"></div></section>
<section class="card"><h2>数式</h2><div id="formula" class="formula"></div></section>
</main>

<script>
const data = {"KNO3": {"name": "硝酸カリウム KNO₃", "plain": "硝酸カリウム", "formula": "KNO₃", "values": {"0": 13.3, "10": 22.0, "20": 31.6, "30": 45.6, "40": 63.9, "60": 109, "80": 169, "100": 245}}, "CuSO4": {"name": "硫酸銅(II) CuSO₄", "plain": "硫酸銅(II)", "formula": "CuSO₄", "values": {"0": 14.0, "10": 17.0, "12": 15, "20": 20.2, "30": 24.1, "40": 28.7, "48": 25, "60": 39.9, "80": 56.0, "100": 94.9}}, "NaCl": {"name": "塩化ナトリウム NaCl", "plain": "塩化ナトリウム", "formula": "NaCl", "values": {"0": 35.7, "10": 35.7, "20": 35.8, "30": 36.1, "40": 36.3, "60": 37.1, "80": 38.0, "100": 39.3}}, "KCl": {"name": "塩化カリウム KCl", "plain": "塩化カリウム", "formula": "KCl", "values": {"0": 28.1, "10": 31.2, "20": 34.2, "30": 37.2, "40": 40.1, "60": 45.8, "80": 51.3, "100": 56.3}}, "AgNO3": {"name": "硝酸銀 AgNO₃", "plain": "硝酸銀", "formula": "AgNO₃", "values": {"0": 121, "10": 167, "20": 216, "30": 265, "40": 312, "60": 441, "80": 585, "100": 733}}, "NaNO3": {"name": "硝酸ナトリウム NaNO₃", "plain": "硝酸ナトリウム", "formula": "NaNO₃", "values": {"0": 73.0, "10": 80.5, "20": 88.0, "30": 96.1, "40": 105, "60": 124, "80": 148, "100": 175}}, "Na2SO4": {"name": "硫酸ナトリウム Na₂SO₄", "plain": "硫酸ナトリウム", "formula": "Na₂SO₄", "values": {"0": 4.5, "10": 9.0, "20": 19.0, "30": 41.2, "40": 49.7, "60": 45.1, "80": 43.3, "100": 42.2}}, "CaSO4": {"name": "硫酸カルシウム CaSO₄", "plain": "硫酸カルシウム", "formula": "CaSO₄", "values": {"0": 0.18, "10": 0.19, "20": 0.21, "30": 0.21, "40": 0.21, "60": 0.15, "80": 0.1, "100": 0.07}}, "ZnSO4": {"name": "硫酸亜鉛 ZnSO₄", "plain": "硫酸亜鉛", "formula": "ZnSO₄", "values": {"0": 41.6, "10": 47.3, "20": 53.8, "30": 69.4, "40": 75.4, "60": 72.1, "80": 65.0, "100": 60.5}}};
let mode="max", temp=40, hot=60, cold=10, coolInputMode="solution";

const $ = (id)=>document.getElementById(id);
const n = (id)=>Number($(id).value);
const f = (x)=>Math.round(Number(x)*10)/10;
const fi = (x)=>Math.round(Number(x));
const tempsFor = (k)=>Object.keys(data[k].values).map(Number).sort((a,b)=>a-b);
const s = (k,t)=>Number(data[k].values[t]);
const pct = (x,t)=>t>0?Math.max(0,Number(x)/t*100):0;
const pill = (a,b)=>`<div class="pill"><span>${a}</span><b>${b}</b></div>`;

function chooseDefaultTemp(key, preferred, fallbackIndex=0){
  const ts=tempsFor(key);
  if(ts.includes(preferred)) return preferred;
  return ts[fallbackIndex] ?? ts[0];
}
function currentKey(){return mode.startsWith("hydrate") ? "CuSO4" : $("sub").value;}

function bar(title,items){
 const total=items.reduce((a,i)=>a+Math.max(0,Number(i.mass)),0);
 return `<div><div class="barLabel"><span>${title}</span><span>合計 ${f(total)} g</span></div><div class="bar">`+
 items.map(i=>`<div class="seg ${i.cls}" style="width:${pct(i.mass,total)}%">${pct(i.mass,total)>10?i.label:""}</div>`).join("")+
 `</div></div>`;
}
function beaker(title,water,solute,crystal=0){
 water=Math.max(0,Number(water)); solute=Math.max(0,Number(solute)); crystal=Math.max(0,Number(crystal));
 const total=Math.max(1,water+solute+crystal);
 const liqH=Math.max(8,Math.min(160,(water+solute)/total*170));
 const solH=crystal>0?Math.max(8,Math.min(80,crystal/total*170)):0;
 return `<div class="beaker"><b>${title}</b><div class="cup"><div class="liquid" style="height:${liqH}px">溶液 ${f(water+solute)}g</div><div class="solid" style="height:${solH}px">${crystal>0?"結晶 "+f(crystal)+"g":""}</div></div><p>水 ${f(water)}g / 溶質 ${f(solute)}g${crystal>0?" / 結晶 "+f(crystal)+"g":""}</p></div>`;
}
function renderRatio(){
 const show=mode.startsWith("hydrate");
 $("ratioSection").classList.toggle("hidden",!show);
 if(!show) return;
 $("ratioInfo").innerHTML = `
 <b>CuSO₄・5H₂O の中身</b>
 <div class="ratioGrid">
  <div class="ratioBox"><div>CuSO₄部分</div><div class="ratioBig">160 / 250</div><div>＝ 0.64 ＝ 64%</div></div>
  <div class="ratioBox"><div>結晶水 5H₂O</div><div class="ratioBig">90 / 250</div><div>＝ 0.36 ＝ 36%</div></div>
 </div>
 <div class="miniBar"><div class="miniCu" style="width:64%">CuSO₄ 160</div><div class="miniWater" style="width:36%">5H₂O 90</div></div>
 <div style="margin-top:8px">CuSO₄・5H₂Oを x g とすると、<b>CuSO₄部分 = 160/250 × x</b>、<b>水和水 = 90/250 × x</b></div>`;
}
function getInitial(hotSol){
 let water0, solute0, M, note;
 if(coolInputMode==="solution"){
  M=n("solutionMass"); water0=M*100/(100+hotSol); solute0=M*hotSol/(100+hotSol); note=`飽和溶液 ${f(M)}g から逆算`;
 } else if(coolInputMode==="water"){
  water0=n("coolWater"); solute0=water0*hotSol/100; M=water0+solute0; note=`溶媒 ${f(water0)}g から飽和溶液を計算`;
 } else if(coolInputMode==="solute"){
  solute0=n("coolSolute"); water0=solute0*100/hotSol; M=water0+solute0; note=`溶質 ${f(solute0)}g から飽和溶液を計算`;
 } else {
  water0=n("coolWater"); solute0=n("coolSolute"); M=water0+solute0; note=`入力された溶媒＋溶質を使用`;
 }
 return {water0,solute0,M,note};
}
function conditionSentence(init, soluteName="溶質"){
 if(coolInputMode==="solution"){
  return `冷却前の飽和溶液は ${f(init.M)}g であり，その中には溶媒（水）${f(init.water0)}g，${soluteName}${f(init.solute0)}g が含まれている。`;
 }
 if(coolInputMode==="water"){
  return `冷却前の溶媒（水）は ${f(init.water0)}g であり，飽和しているので${soluteName}${f(init.solute0)}g が溶け，溶液全体は ${f(init.M)}g である。`;
 }
 if(coolInputMode==="solute"){
  return `冷却前に溶けている${soluteName}は ${f(init.solute0)}g であり，飽和しているので溶媒（水）は ${f(init.water0)}g，溶液全体は ${f(init.M)}g である。`;
 }
 return `冷却前の溶媒（水）は ${f(init.water0)}g，溶けている${soluteName}は ${f(init.solute0)}g，溶液全体は ${f(init.M)}g である。`;
}
function renderButtons(box, kind, selected, key){
 const ts=tempsFor(key); const el=$(box); el.innerHTML="";
 if(!ts.includes(selected)){
  if(kind==="temp") temp=chooseDefaultTemp(key,40);
  if(kind==="hot") hot=chooseDefaultTemp(key,60,ts.length-1);
  if(kind==="cold") cold=chooseDefaultTemp(key,10);
  selected = kind==="temp"?temp:kind==="hot"?hot:cold;
 }
 ts.forEach(t=>{
  const b=document.createElement("button");
  b.textContent=t+"℃"; b.className=t===selected?"on":"";
  b.onclick=()=>{ if(kind==="temp") temp=t; if(kind==="hot") hot=t; if(kind==="cold") cold=t; render(); };
  el.appendChild(b);
 });
}

function renderMax(){
 const key=$("sub").value, sol=s(key,temp), w=n("water"), amount=w*sol/100, solution=w+amount;
 $("problem").innerHTML=`問　${temp}℃の水 ${f(w)}g に${data[key].plain}は何gまで溶けるか。また，できる飽和溶液は何gか。ただし，${data[key].plain}の${temp}℃における溶解度は${sol}である。`;
 $("answer").innerHTML=pill("答え",`${f(amount)} g`)+pill("整数値",`${fi(amount)} g`)+pill("溶液",`${f(solution)} g`)+pill("溶解度",`${sol}`);
 $("beakers").innerHTML=beaker("飽和溶液",w,amount,0);
 $("bars").innerHTML=bar("飽和溶液",[{label:`水 ${f(w)}g`,mass:w,cls:"water"},{label:`溶質 ${f(amount)}g`,mass:amount,cls:"solute"}]);
 $("formula").textContent=`溶解度 = 水100gに${data[key].formula} ${sol}g

水 ${f(w)}g のとき
溶ける量 = ${f(w)} × ${sol} / 100 = ${f(amount)}g

溶媒 : 溶質 : 溶液
= 100 : ${sol} : ${f(100+sol)}
= ${f(w)} : ${f(amount)} : ${f(solution)}`;
}
function renderCool(){
 const key=$("sub").value, sH=s(key,hot), sC=s(key,cold);
 const init=getInitial(sH), M=init.M, water0=init.water0, solute0=init.solute0;
 const soluteCold=water0*sC/100, crystal=Math.max(0,solute0-soluteCold);
 $("problem").innerHTML=`例題　${data[key].plain}の${hot}℃における飽和水溶液を${cold}℃に冷やす。${conditionSentence(init, data[key].formula)}ただし，${data[key].plain}の溶解度は，${hot}℃で${sH}，${cold}℃で${sC}である。このとき，何gの結晶が析出するか。`;
 $("answer").innerHTML=pill("析出量",`${f(crystal)} g`)+pill("整数値",`${fi(crystal)} g`)+pill("冷却前溶液",`${f(M)} g`)+pill("水",`${f(water0)} g`);
 $("beakers").innerHTML=beaker(`${hot}℃`,water0,solute0,0)+beaker(`${cold}℃`,water0,soluteCold,crystal);
 $("bars").innerHTML=bar("冷却前",[{label:`水 ${f(water0)}g`,mass:water0,cls:"water"},{label:`溶質 ${f(solute0)}g`,mass:solute0,cls:"solute"}])+bar("冷却後",[{label:`水 ${f(water0)}g`,mass:water0,cls:"water"},{label:`溶質 ${f(soluteCold)}g`,mass:soluteCold,cls:"solute"},{label:`結晶 ${f(crystal)}g`,mass:crystal,cls:"crystal"}]);
 $("formula").textContent=`入力：${init.note}

${hot}℃の溶解度 = ${sH}g
飽和溶液の比
水 : 溶質 : 溶液 = 100 : ${sH} : ${f(100+sH)}

冷却前
水 = ${f(water0)}g
溶質 = ${f(solute0)}g
溶液 = ${f(M)}g

${cold}℃の溶解度 = ${sC}g
冷却後に溶けていられる量
= ${f(water0)} × ${sC} / 100
= ${f(soluteCold)}g

析出量 = ${f(solute0)} - ${f(soluteCold)}
= ${f(crystal)}g`;
}
function renderHydrateDissolve(){
 const sol=s("CuSO4",temp), w=n("water");
 const x=sol*w/(64-0.36*sol);
 const cuso4=0.64*x, hyd=0.36*x, totalWater=w+hyd;
 $("problem").innerHTML=`例題　硫酸銅(II)五水和物 CuSO₄・5H₂O（式量250）は，${temp}℃の水 ${f(w)}g に何g溶けるか。溶けた水和物中にはCuSO₄部分と水和水が何g含まれ，できる飽和溶液は何gか。ただし，硫酸銅(II)CuSO₄（式量160）の${temp}℃における溶解度は${sol}である。`;
 $("answer").innerHTML=pill("水和物",`${f(x)} g`)+pill("整数値",`${fi(x)} g`)+pill("CuSO₄部分",`${f(cuso4)} g`)+pill("水和水",`${f(hyd)} g`);
 $("beakers").innerHTML=beaker("水和物を溶かした後",totalWater,cuso4,0);
 $("bars").innerHTML=bar("加える水和物の内訳",[{label:`CuSO₄ ${f(cuso4)}g`,mass:cuso4,cls:"solute"},{label:`水和水 ${f(hyd)}g`,mass:hyd,cls:"hydrate"}])+bar("できた飽和溶液",[{label:`水 ${f(totalWater)}g`,mass:totalWater,cls:"water"},{label:`CuSO₄ ${f(cuso4)}g`,mass:cuso4,cls:"solute"}]);
 $("formula").textContent=`CuSO₄・5H₂Oを x g 溶かす

CuSO₄部分 = 160/250 x = 0.64x
水和水 = 90/250 x = 0.36x
溶媒としての水 = ${f(w)} + 0.36x

溶解度 ${sol} より
CuSO₄ : 水 = ${sol} : 100

0.64x : (${f(w)} + 0.36x) = ${sol} : 100

x = ${f(x)}g`;
}
function renderHydrateCool(){
 const sH=s("CuSO4",hot), sC=s("CuSO4",cold);
 const init=getInitial(sH), M=init.M, water0=init.water0, cuso40=init.solute0;
 let x=(cuso40-sC*water0/100)/(0.64-0.36*sC/100);
 const crystal=Math.max(0,x), cuso4F=cuso40-0.64*crystal, waterF=water0-0.36*crystal;
 $("problem").innerHTML=`〔問題〕硫酸銅(II)の${hot}℃における飽和水溶液を${cold}℃まで冷却する。${conditionSentence(init, "CuSO₄")}ただし，硫酸銅(II)CuSO₄の溶解度は，${hot}℃で${sH}，${cold}℃で${sC}であり，析出する結晶はCuSO₄・5H₂Oである。このとき，何gの結晶が析出するか。`;
 $("answer").innerHTML=pill("析出結晶",`${f(crystal)} g`)+pill("整数値",`${fi(crystal)} g`)+pill("残るCuSO₄",`${f(cuso4F)} g`)+pill("残る水",`${f(waterF)} g`);
 $("beakers").innerHTML=beaker(`${hot}℃`,water0,cuso40,0)+beaker(`${cold}℃`,waterF,cuso4F,crystal);

function updateVisibility(){
 const hyd=mode.startsWith("hydrate");
 const cooling=(mode==="cool"||mode==="hydrateCool");
 $("normalSubBox").classList.toggle("hidden",hyd);
 $("hydrateSubBox").classList.toggle("hidden",!hyd);
 $("oneTemp").classList.toggle("hidden",cooling);
 $("twoTemp").classList.toggle("hidden",!cooling);
 $("waterBox").classList.toggle("hidden",cooling);
 $("coolInputModeBox").classList.toggle("hidden",!cooling);
 $("solutionBox").classList.toggle("hidden",!(cooling&&coolInputMode==="solution"));
 $("coolWaterBox").classList.toggle("hidden",!(cooling&&(coolInputMode==="water"||coolInputMode==="both")));
 $("coolSoluteBox").classList.toggle("hidden",!(cooling&&(coolInputMode==="solute"||coolInputMode==="both")));
 ["bySolution","byWater","bySolute","byBoth"].forEach(id=>$(id).classList.remove("on"));
 if(coolInputMode==="solution") $("bySolution").classList.add("on");
 if(coolInputMode==="water") $("byWater").classList.add("on");
 if(coolInputMode==="solute") $("bySolute").classList.add("on");
 if(coolInputMode==="both") $("byBoth").classList.add("on");
}
function render(){
 updateVisibility();
 renderRatio();
 const key=currentKey();
 renderButtons("tempBtns","temp",temp,key);
 renderButtons("hotBtns","hot",hot,key);
 renderButtons("coldBtns","cold",cold,key);
 if(mode==="max") renderMax();
 if(mode==="cool") renderCool();
 if(mode==="hydrateDissolve") renderHydrateDissolve();
 if(mode==="hydrateCool") renderHydrateCool();
}
function pair(a,b){
 $(a).oninput=()=>{$(b).value=$(a).value;render();};
 $(b).oninput=()=>{$(a).value=$(b).value;render();};
}

Object.keys(data).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=data[k].name;$("sub").appendChild(o);});
$("sub").value="KNO3";
$("sub").onchange=()=>{const key=$("sub").value;temp=chooseDefaultTemp(key,40);hot=chooseDefaultTemp(key,60,tempsFor(key).length-1);cold=chooseDefaultTemp(key,10);render();};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.mode;render();});
pair("water","waterNum");pair("solutionMass","solutionMassNum");pair("coolWater","coolWaterNum");pair("coolSolute","coolSoluteNum");
$("bySolution").onclick=()=>{coolInputMode="solution";render();};
$("byWater").onclick=()=>{coolInputMode="water";render();};
$("bySolute").onclick=()=>{coolInputMode="solute";render();};
$("byBoth").onclick=()=>{coolInputMode="both";render();};
render();
