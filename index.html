let selected='mass',quiz=[],idx=0,score=0,chosen=null,answered=false,stats=JSON.parse(localStorage.getItem('chemquestStats_v2')||'{}');
fields.forEach(f=>{if(!stats[f.id])stats[f.id]={try:0,ok:0}});save();document.getElementById('qtotal').textContent=allQuestions.length+'問';renderFields();updateSummary();
function bank(id){return allQuestions.filter(q=>q.cat===id)}
function rate(id){const s=stats[id];return s.try?Math.round(s.ok/s.try*100):0}
function level(r){return r>=85?'完成':r>=60?'定着':r>=30?'練習中':'未習得'}
function renderFields(){document.getElementById('fields').innerHTML=fields.map(f=>{let r=rate(f.id),lv=level(r),n=bank(f.id).length;return `<div class="field ${selected==f.id?'active':''}" onclick="selectField('${f.id}')" style="border-color:${f.color}88"><div class="num" style="background:${f.color}">${f.num}</div><h3 style="color:${f.color}">${f.icon}<br>${f.name}</h3><p>${f.desc}</p><p class="small">収録 ${n}問</p><b>習熟度　${r}%</b><div class="meter"><div class="fill" style="width:${r}%;background:${f.color}"></div></div><div class="badge" style="color:${f.color};border:1px solid ${f.color}66;background:${f.color}12">${lv}</div></div>`}).join('')}
function selectField(id){selected=id;renderFields()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){let n=document.getElementById('count').value;let b=shuffle(bank(selected));quiz=n==='all'?b:b.slice(0,Math.min(+n,b.length));idx=0;score=0;document.getElementById('quiz').classList.remove('hidden');showQ();window.scrollTo({top:document.getElementById('quiz').offsetTop-20,behavior:'smooth'})}
function showQ(){chosen=null;answered=false;document.getElementById('feedback').classList.add('hidden');document.getElementById('answerBtn').disabled=false;let q=quiz[idx];document.getElementById('quizTitle').textContent=fields.find(f=>f.id==selected).name;document.getElementById('now').textContent=idx+1;document.getElementById('max').textContent=quiz.length;document.getElementById('bar').style.width=((idx+1)/quiz.length*100)+'%';document.getElementById('qtext').textContent=q.text;document.getElementById('chem').textContent=q.chem;document.getElementById('hint').innerHTML='<b>原子量・条件</b><br>H=1.0 C=12 N=14 O=16<br>Na=23 Mg=24 Al=27 S=32 Cl=35.5 Ca=40 Cu=64 Fe=56 Ag=108<br>気体1mol=22.4L';document.getElementById('choices').innerHTML=q.choices.map((c,i)=>`<div class="choice" onclick="choose(${i})">${'①②③④'[i]}　${c}</div>`).join('')}
function choose(i){if(answered)return;chosen=i;[...document.querySelectorAll('.choice')].forEach((e,n)=>e.classList.toggle('selected',n==i))}
function checkAnswer(){if(chosen===null||answered)return;answered=true;let q=quiz[idx],cs=[...document.querySelectorAll('.choice')];cs.forEach((e,n)=>{if(n==q.ans)e.classList.add('correct'); if(n==chosen&&n!=q.ans)e.classList.add('wrong')});let ok=chosen==q.ans;if(ok)score++;stats[selected].try++;if(ok)stats[selected].ok++;save();document.getElementById('explain').textContent=q.exp;document.getElementById('mistake').textContent=q.hint;document.getElementById('feedback').classList.remove('hidden');document.getElementById('answerBtn').disabled=true;renderFields();updateSummary()}
function nextQuestion(){if(idx<quiz.length-1){idx++;showQ()}else{alert(`終了！ ${quiz.length}問中 ${score}問正解です。`);endQuiz()}}
function endQuiz(){document.getElementById('quiz').classList.add('hidden')}
function updateSummary(){let rs=fields.map(f=>rate(f.id)),avg=Math.round(rs.reduce((a,b)=>a+b,0)/fields.length);document.getElementById('totalRate').textContent=avg+'%';['未習得','練習中','定着','完成'].forEach((l,i)=>document.getElementById('lv'+i).textContent=rs.filter(r=>level(r)==l).length);document.querySelector('.ring').style.background=`conic-gradient(#22c55e 0 ${avg}%,#e5e7eb ${avg}% 100%)`}
function resetAll(){if(confirm('学習記録をリセットしますか？')){fields.forEach(f=>stats[f.id]={try:0,ok:0});save();renderFields();updateSummary()}}
function save(){localStorage.setItem('chemquestStats_v2',JSON.stringify(stats))}
</script></body></html>
